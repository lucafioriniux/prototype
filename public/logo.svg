<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2127"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Stratified 3D Printing Layer Lines (Background Layering) -->
  <path d="M10 32 L38 32" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 28 L36 28" stroke="#3f3f46" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M14 24 L34 24" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dual Cyclonic Vortex & Quick-Release Detent Wings -->
  <!-- Left Cyclone Wing (Electric Cyan) -->
  <path d="M24 8 C16 8 11 14 11 20 C11 27 16 32 23 35 C20 33 16 29 16 23 C16 17 19 13 24 11 Z" 
        fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Right Cyclone Wing (Signature Magenta) -->
  <path d="M24 40 C32 40 37 34 37 28 C37 21 32 16 25 13 C28 15 32 19 32 25 C32 31 29 35 24 37 Z" 
        fill="url(#pinkGrad)" filter="url(#glow)"/>

  <!-- Center Extrusion Core / Quick Release Collar Pin -->
  <circle cx="24" cy="24" r="4.5" fill="#09090b" stroke="url(#cyanGrad)" stroke-width="2"/>
  <circle cx="24" cy="24" r="1.75" fill="#f43f5e"/>

  <!-- Calibrated Detent Marks (Precision Engineering) -->
  <line x1="24" y1="4" x2="24" y2="7" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="7" y2="24" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="44" y2="24" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
